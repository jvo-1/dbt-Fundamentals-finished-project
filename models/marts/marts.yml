version: 2

models:
  - name: dim_customers
    description: customers dimension model
    columns: 
      - name: customer_id
        description: The primary key for customers.
        tests:
          - unique
          - not_null
  - name: fct_product_analysis
    config:
      freshness:
        build_after: 
          count: 10
          period: minute
          updates_on: any  